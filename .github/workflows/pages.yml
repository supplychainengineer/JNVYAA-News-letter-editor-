name: Build & publish newsletters

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - name: Install Playwright (for PDF + PNG exports)
        run: npm i --no-save playwright@1.48.2 && npx playwright install --with-deps chromium
      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r index.html assets src newsletters _site/
          node cli/build.mjs --out _site/issues --pdf --png
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
